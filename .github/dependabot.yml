# Weekly, grouped dependency updates. Security updates are switched on in the
# repository settings, not here.
version: 2
updates:
  - package-ecosystem: npm
    # One lockfile, at the root, covers the workspaces (packages/*, mcp-server).
    directory: /
    schedule:
      interval: weekly
    groups:
      # Listed first: a dependency joins the first group it matches. Tailwind's
      # packages move together, majors included: scripts/build-spec-tokens.ts
      # calls a private API of @tailwindcss/node that must match tailwindcss.
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Ignored on 2026-09-29 (Toniio/DSAIReadable#43 and #46, closed).
      # TypeScript 7 ships no JavaScript compiler API: generate-context,
      # specs:api, specs:tokens, specs:states and index:data-slot all read the
      # code through it (`ts.ScriptTarget` is undefined). typescript-eslint does
      # not support it yet either. Lift this once both have a path forward.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Ignored on 2026-09-28 (Toniio/DSAIReadable#37, closed). The code runs
      # on Node 24 (.nvmrc, the workflows) and the types are already one major
      # ahead: each further major accepts more APIs the runtime lacks. Raise it
      # with the Node version, not alone.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Ignored on 2026-11-23 (Toniio/DSAIReadable#218). Recharts 3.11.0 drops
      # the tabindex="-1" of its z-index layer groups, and Chromium then stops
      # Tab on them: a PieChart gains an invisible tab stop, and
      # tests/components/chart.test.tsx fails. The upstream fix
      # (recharts/recharts@e49109d) is not released yet. Delete this entry
      # once a later version is out; this pin covers 3.11.0 only.
      - dependency-name: recharts
        versions:
          - 3.11.0
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
