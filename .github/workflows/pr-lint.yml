name: PR title

# With squash merges, the PR title becomes the commit message on `main`. A
# non-conforming title would break the Conventional Commits history that the
# commit-msg hook protects locally.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    name: lint-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # The title goes through an environment variable, never through a
      # ${{ }} interpolation in the shell: a PR title is input controlled by
      # its author (command injection).
      - name: Validate PR title against commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx --no -- commitlint
