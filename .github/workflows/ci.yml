name: CI

# No `paths:` filter, on purpose: a check required by branch protection must run
# on every PR; otherwise it stays "pending" and blocks the merge instead of
# guarding it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  tokens-validate:
    name: tokens-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run tokens-validate

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck:all

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:language
      - run: npx prettier --check "**/*.{ts,tsx,md}"
      # Zero-base: no unused file, export or dependency, in the app or in
      # mcp-server/ (knip.jsonc lists the entry points and why).
      - run: npm run knip
      # One version everywhere it is served, and each pending changeset
      # follows the semver policy of CONTRIBUTING.md.
      - run: npm run release:check

  index-schema:
    name: index-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run index:validate
      - run: npm run shadcn:retokenize

  spec-sections:
    name: spec-sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run specs:validate
      - run: npm run skills:validate
      # The Agent Skills format's own validator, pinned; skills:validate repeats
      # its checks and adds the repository's (citations, tools).
      - run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet skills-ref==0.1.1
          for skill in skills/*/; do "$RUNNER_TEMP/skills-ref/bin/agentskills" validate "$skill"; done

  context-freshness:
    name: context-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run generate-context
      # `git diff --exit-code` would miss a newly generated, untracked context
      # file: that is exactly the case that must fail.
      - name: Fail if generated context drifted
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The generated context has drifted from its sources. Run 'npm run generate-context' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  mcp-test:
    name: mcp-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run plugin:test
      - run: npm run mcp:test
      # The packages a consumer installs, not the sources: built, packed, then
      # run through npx from an empty folder. The server and the ESLint plugin
      # it depends on are installed from their tarballs, the rest from the npm
      # registry.
      - run: npm run mcp:test-package

  component-tests:
    name: component-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Every component rendered from its spec, every documented key tested.
      - run: npm run test:lint-coverage
      # The tests run in headless Chromium: cached by Playwright version.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:components
      # The keyboard tests wait for timers the primitives own: Base UI unmounts
      # a popup one frame after Escape, input-otp re-reads the selection 0, 10
      # and 50 ms after a value change, Radix moves the focus in a timeout. A
      # single run rarely catches a new race (before #90, 2 full runs in 30
      # failed), so when a Dependabot PR moves one of those packages in the
      # lockfile, each keyboard test runs 50 times (about 40 s).
      - name: Find the primitives a Dependabot PR bumps
        id: primitives
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # checkout fetched one commit: the base is not there yet
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          primitives() {
            git show "$1:package-lock.json" | jq -r '
              .packages | to_entries[]
              | select(.key | test("(^|/)node_modules/(radix-ui|@radix-ui/[^/]+|@base-ui/react|input-otp)$"))
              | "\(.key) \(.value.version)"' | sort
          }
          bumped="$(diff <(primitives "$BASE_SHA") <(primitives HEAD) || true)"
          if [ -n "$bumped" ]; then
            echo "$bumped"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keyboard primitive moves in package-lock.json."
          fi
      - name: Stress the keyboard tests
        if: steps.primitives.outputs.bumped == 'true'
        run: npx vitest run --project components --repeats 49 tests/components/combobox.test.tsx tests/components/input-otp.test.tsx tests/components/radio-group.test.tsx
      # The conformance harness scores the specs' own examples and its
      # fixtures: gold passes stages A and B, each fixture fails what it declares.
      - run: npm run evals:test

  registry:
    name: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Freshness first: it also rejects bare or dangling registryDependencies,
      # which `shadcn registry validate` does not look at.
      - run: npm run registry:check
      - run: npx --no -- shadcn registry validate ./registry.json
      # The only check that proves the registry is consumable: every item
      # installed into a blank app, then type-checked. A pull request tests the
      # registry it builds; a push to main tests the published addresses.
      - run: npm run registry:test-install -- --source ${{ github.event_name == 'push' && 'github' || 'local' }}
      # Each component against its shadcn/ui upstream at the anchored tag, run
      # through the re-tokenization codemod: re-anchored components match it,
      # every difference is declared in shadcn-upstream.json.
      - run: npm run shadcn:drift
      # The release pipeline (a changeset becomes a version, a CHANGELOG entry
      # and one number everywhere) and what a pinned install pins. Both run on
      # throwaway copies and a local git remote: no network.
      - run: npm run release:test

  # The documentation site, tested in three shards on three runners: in one
  # job, site:test alone took 6 minutes and set the wall time of every run.
  # Each shard builds the site itself (about 45 s) rather than waiting for a
  # build job to upload it (about 80 s before any shard could start): its
  # pages start loading sooner.
  site-test:
    name: site-test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to its end: a failure in one does not cancel the
      # others, so one run reports every load that has a problem.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The site as GitHub Pages serves it, under /<repository>/ (the Site
      # workflow builds it the same way): every link and preview iframe is
      # prefixed, so that is the build to test.
      SITE_BASE_PATH: /DSAIReadable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The specs' examples copied into site/generated/ match the specs and
      # the MCP answers recorded there match the server,
      # every file of the site passes the lint a consuming project runs, and
      # every focus ring the site composes has a solid part (focus.md). In
      # the first shard only: it adds about 10 s to that shard, where a job of
      # its own would spend about 20 s on npm ci for it.
      - if: matrix.shard == 1
        run: npm run site:check
      # Every page of the documentation site prerenders from the repository's
      # files: a spec, a token or a context file it cannot read fails here.
      # Networked: next/font downloads the typefaces.
      - run: npm run site:build
      # The built site served as GitHub Pages serves it, in headless Chromium:
      # every page and every preview, light and dark, with no axe violation
      # (WCAG 2.2 AA), page error or unexpected response, and a focus
      # indicator on every tab stop. Chromium is cached by Playwright version,
      # as in component-tests.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # This shard's third of the loads, four at a time as in one job (the
      # CI-only flakes so far came from CPU pressure): a route's light and
      # dark loads stay in one shard, the shards' loads add up to the whole
      # run's, and the 404 page is loaded in one of them (scripts/lib/shard.ts).
      - run: npm run site:test -- --shard=${{ matrix.shard }}/3

  # One check for the documentation site, whatever its number of shards: it
  # fails unless every shard of site-test passed. `always()` runs it after a
  # shard that failed or was canceled too, where it must fail rather than be
  # skipped.
  site:
    name: site
    needs: site-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every shard passed
        env:
          RESULT: ${{ needs.site-test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::A shard of site-test did not pass (its result: $RESULT). Its log names the loads that have a problem."
            exit 1
          fi
          echo "Every shard of site-test passed."
