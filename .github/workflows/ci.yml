name: CI

# No `paths:` filter, on purpose: a check required by branch protection must run
# on every PR; otherwise it stays "pending" and blocks the merge instead of
# guarding it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  tokens-validate:
    name: tokens-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run tokens-validate

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck:all

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:language
      - run: npx prettier --check "**/*.{ts,tsx,md}"
      # Zero-base: no unused file, export or dependency, in the app or in
      # mcp-server/ (knip.jsonc lists the entry points and why).
      - run: npm run knip
      # One version everywhere it is served, and each pending changeset
      # follows the semver policy of CONTRIBUTING.md.
      - run: npm run release:check

  index-schema:
    name: index-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run index:validate
      - run: npm run shadcn:retokenize

  spec-sections:
    name: spec-sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run specs:validate
      - run: npm run skills:validate

  context-freshness:
    name: context-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run generate-context
      # `git diff --exit-code` would miss a newly generated, untracked context
      # file: that is exactly the case that must fail.
      - name: Fail if generated context drifted
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The generated context has drifted from its sources. Run 'npm run generate-context' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  mcp-test:
    name: mcp-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run plugin:test
      - run: npm run mcp:test
      # The packages a consumer installs, not the sources: built, packed, then
      # run through npx from an empty folder. The server and the ESLint plugin
      # it depends on are installed from their tarballs, the rest from the npm
      # registry.
      - run: npm run mcp:test-package

  component-tests:
    name: component-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Every component rendered from its spec, every documented key tested.
      - run: npm run test:lint-coverage
      # The tests run in headless Chromium: cached by Playwright version.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:components
      # The conformance harness scores the specs' own examples and its
      # fixtures: gold passes stages A and B, each fixture fails what it declares.
      - run: npm run evals:test

  registry:
    name: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Freshness first: it also rejects bare or dangling registryDependencies,
      # which `shadcn registry validate` does not look at.
      - run: npm run registry:check
      - run: npx --no -- shadcn registry validate ./registry.json
      # The only check that proves the registry is consumable: every item
      # installed into a blank app, then type-checked. A pull request tests the
      # registry it builds; a push to main tests the published addresses.
      - run: npm run registry:test-install -- --source ${{ github.event_name == 'push' && 'github' || 'local' }}
      # Each component against its shadcn/ui upstream at the anchored tag, run
      # through the re-tokenization codemod: re-anchored components match it,
      # every difference is declared in shadcn-upstream.json.
      - run: npm run shadcn:drift
      # The release pipeline (a changeset becomes a version, a CHANGELOG entry
      # and one number everywhere) and what a pinned install pins. Both run on
      # throwaway copies and a local git remote: no network.
      - run: npm run release:test
